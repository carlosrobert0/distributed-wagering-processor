# Ambiente local completo: Postgres, LocalStack (SQS), migrations e 3 instâncias da aplicação.
#
#   docker compose up -d postgres localstack   # só as dependências (para rodar testes no host)
#   docker compose up -d --build               # tudo, com app-1/app-2/app-3 em :3001/:3002/:3003

x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    LOG_LEVEL: info
    PORT: "3000"
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  # SIGTERM → drena consumer e workers; dá tempo para o grace period do consumer.
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Imagem community fixada (versões recentes podem exigir token). Alternativa: MiniStack.
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      # "ready" só depois que o script de init criou as filas.
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 3s
      retries: 60

  migrate:
    build: .
    command: ["bun", "run", "src/infrastructure/persistence/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports:
      - "3003:3000"
